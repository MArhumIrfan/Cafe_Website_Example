<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#14110f;--pn:#1d1916;--ln:#352e29;--tx:#f1e9e0;--mu:#a39a90;--ac:#C98D53}
*{box-sizing:border-box}
body{margin:0;font:13px system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.b{background:#2a241f;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-block}
.b:hover{border-color:var(--ac)}
.b:focus-visible,.i:focus-visible,summary:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.b.p{background:var(--ac);color:#1a1209;font-weight:700;border:0}
main{flex:1;display:flex;min-height:0}
#side{width:440px;max-width:50vw;overflow:auto;padding:10px;background:var(--pn);border-right:1px solid var(--ln)}
#view{flex:1;display:flex;justify-content:center;background:#0c0a09;padding:10px;overflow:auto}
#wrap{width:100%;height:100%;background:#fff;border-radius:10px;overflow:hidden;transition:width .25s}
iframe{width:100%;height:100%;border:0}
details{border:1px solid var(--ln);border-radius:8px;margin:6px 0;background:rgba(255,255,255,.02)}
summary{cursor:pointer;padding:7px 10px;font-weight:600;text-transform:capitalize;display:flex;gap:6px;align-items:center}
.in{padding:4px 10px 8px}
label.f{display:block;margin:6px 0}
label.f>span{display:block;color:var(--mu);font-size:11px;margin-bottom:2px;text-transform:capitalize}
.i{width:100%;background:#120f0d;border:1px solid var(--ln);border-radius:6px;padding:6px 8px}
textarea.i{min-height:64px;resize:vertical}
.row{display:flex;gap:6px;align-items:center}.sm{padding:2px 8px;font-size:12px}
.th{width:64px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--ln)}
#welcome{position:fixed;inset:49px 0 0 0;background:var(--bg);display:flex;z-index:5}
#drop{margin:auto;text-align:center;padding:40px;border:2px dashed var(--ln);border-radius:16px;max-width:540px;line-height:1.6}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);color:#1a1209;padding:8px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.3s;z-index:9;pointer-events:none}
</style>
</head>
<body>
<header>
 <b style="font-size:15px"><i class="fa-solid fa-sliders" style="color:var(--ac)"></i> Site Studio</b>
 <label class="b">Open template<input id="f-tpl" type="file" accept=".html,.htm" hidden></label>
 <select id="preset" class="b" title="Start from a preset"></select>
 <button class="b" id="undo" title="Undo" aria-label="Undo">↶</button><button class="b" id="redo" title="Redo" aria-label="Redo">↷</button>
 <label class="b">Load project<input id="f-proj" type="file" accept=".json" hidden></label>
 <button class="b" id="save">Save project</button>
 <span id="sv" style="color:var(--mu);font-size:11px" aria-live="polite"></span>
 <span style="flex:1"></span>
 <button class="b" id="editbtn" aria-pressed="true" title="Click text in the preview to edit it" aria-label="Toggle click-to-edit in preview" style="border-color:var(--ac)"><i class="fa-solid fa-pen-to-square"></i></button>
 <button class="b" data-w="100%" title="Desktop" aria-label="Desktop preview"><i class="fa-solid fa-desktop"></i></button>
 <button class="b" data-w="820px" title="Tablet" aria-label="Tablet preview"><i class="fa-solid fa-tablet-screen-button"></i></button>
 <button class="b" data-w="390px" title="Phone" aria-label="Phone preview"><i class="fa-solid fa-mobile-screen"></i></button>
 <button class="b p" id="export"><i class="fa-solid fa-download"></i> Export website</button>
</header>
<main><div id="side"><div id="tree"></div></div><div id="view"><div id="wrap"><iframe id="fr" title="Live preview"></iframe></div></div></main>
<div id="welcome"><div id="drop"><h2 style="margin-top:0">Open your template</h2>
 <p>Drag <b>modular-food-website.html</b> here, or pick it below. You can also open a site you exported earlier and keep editing it.</p>
 <label class="b p">Choose file<input id="f-first" type="file" accept=".html,.htm" hidden></label></div></div>
<div id="msg"></div>
<div id="dlg" style="display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center"><div role="dialog" aria-modal="true" style="background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:20px;max-width:380px"><p id="dlg-t" style="margin-top:0;line-height:1.5"></p><div class="row" style="justify-content:flex-end"><button class="b" id="dlg-n">Cancel</button><button class="b p" id="dlg-y">Yes, replace</button></div></div></div>
<datalist id="fonts"><option>Playfair Display<option>Cormorant Garamond<option>DM Serif Display<option>Oswald<option>Poppins<option>Inter<option>Lora<option>Montserrat<option>Raleway<option>Merriweather<option>Bebas Neue<option>Roboto Slab<option>Pacifico</datalist>
<datalist id="ids"><option>hero<option>model3d<option>about<option>menu<option>team<option>reviews<option>gallery<option>events<option>video<option>faq<option>contact<option>location<option>custom</datalist>

<script>
/* ---------- state & helpers ---------- */
let src='',cfg=null,PRES={},hist=[],hi=-1,opened=new Set(),frLoaded=false,tm;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const get=p=>p.reduce((o,k)=>o[k],cfg),set=(p,v)=>{get(p.slice(0,-1))[p[p.length-1]]=v};
const idb=(()=>{let db;const open=()=>db||(db=new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('no IndexedDB'));const r=indexedDB.open('site-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
 const tx=(m,f)=>open().then(d=>new Promise((ok,no)=>{const t=d.transaction('kv',m),q=f(t.objectStore('kv'));t.oncomplete=()=>ok(q.result);t.onerror=t.onabort=()=>no(t.error||new Error('storage error'))}));
 return{get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k))}})();
let warned=false;
function save(){idb.set('cfg',JSON.stringify(cfg)).then(()=>{$('#sv').textContent='Autosaved ✓'}).catch(()=>{$('#sv').textContent='⚠ Not autosaved';if(!warned){warned=true;msg('⚠ Autosave failed (storage full or blocked). Click "Save project" to keep your work.')}})}
const lum=h=>{const c=h.replace('#','').match(/../g).map(x=>{x=parseInt(x,16)/255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function merge(a,b){if(b===undefined)return a;if(!b||typeof b!=='object'||Array.isArray(b))return b;const o={...a};for(const k in b)o[k]=(a&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))?merge(a[k],b[k]):b[k];return o}
function msg(t){const m=$('#msg');m.textContent=t;m.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.opacity=0,3000)}
const readText=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsText(f)});
const readURL=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});
const shrink=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.onerror=()=>ok(r.result);i.src=r.result};r.readAsDataURL(f)});
const slug=()=>((cfg&&cfg.brand&&cfg.brand.name)||'website').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'website';
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

/* ---------- read the template ---------- */
/* HTML-like tokens are assembled from parts so editors and HTML parsers never mistake them for real tags inside this script. */
const LT='<',TAG_OPEN=LT+'script>',TAG_CLOSE=LT+'/script>',SEO_A=LT+'!--seo-->',SEO_B=LT+'!--/seo-->';
function parse(text){
 const js=[...text.matchAll(new RegExp(TAG_OPEN+'([\\s\\S]*?)'+LT+'\\/script>','g'))].map(m=>m[1]).find(x=>x.includes('const CAFE'));
 if(!js)throw new Error('This is not the modular template (or an export of it).');
 const a=js.indexOf('const CAFE'),b=js.indexOf('const PRESETS'),e=js.indexOf('\n',b),mg=js.match(/function merge\(a,b\)\{.*\}/);
 if(!mg||b<0)throw new Error('Could not find the config block in this file.');
 const P=new Function(mg[0]+';'+js.slice(a,e)+';return PRESETS')();
 const ex=text.match(new RegExp('(?:^|'+TAG_OPEN+')const EXPORTED_CFG=(.*);\\n','m'));
 return{P,ex:ex?JSON.parse(ex[1]):null};
}
/* ---------- write the final site ---------- */
function seoTags(c){
 const s=c.seo||{},desc=s.description||c.brand.tagline,im=/^https?:/.test(s.image||'')?s.image:'';
 const ld={'@context':'https://schema.org','@type':s.type||'Restaurant',name:c.brand.name,description:desc,address:c.location&&c.location.address,image:im||undefined};
 const meta=n=>LT+'meta '+n+'>';
 return SEO_A+meta('name="description" content="'+esc(desc)+'"')+meta('property="og:title" content="'+esc(c.brand.name)+'"')+meta('property="og:description" content="'+esc(desc)+'"')
  +(im?meta('property="og:image" content="'+esc(im)+'"'):'')+meta('name="theme-color" content="'+esc(c.theme.accent)+'"')
  +LT+'script type="application/ld+json">'+JSON.stringify(ld).replace(new RegExp(LT,'g'),'\\u003c')+TAG_CLOSE+SEO_B;
}
function build(c){
 const j=JSON.stringify(c).replace(new RegExp(LT,'g'),'\\u003c');
 return src.replace(new RegExp('(^|'+TAG_OPEN+')const EXPORTED_CFG=.*;\\n','m'),(m,a)=>a)
  .replace(/const SHOW_EDITOR\s*=\s*\w+;/,()=>`const EXPORTED_CFG=${j};\nconst SHOW_EDITOR = false;`)
  .replace(new RegExp(LT+'title>[\\s\\S]*?'+LT+'\\/title>'),()=>LT+'title>'+esc(c.brand.name)+' | '+esc(c.brand.tagline)+LT+'/title>')
  .replace(new RegExp(SEO_A+'[\\s\\S]*?'+SEO_B),'').replace(LT+'/head>',()=>seoTags(c)+LT+'/head>');
}
function loadTemplate(text,keepCfg){
 const r=parse(text);src=text;PRES=r.P;
 const keys=Object.keys(PRES);
 $('#preset').innerHTML='<option value="">Load preset…</option>'+keys.map(k=>`<option>${esc(k)}</option>`).join('');
 cfg=keepCfg||r.ex||clone(PRES[keys[0]]);
 $('#welcome').style.display='none';idb.set('src',text).catch(()=>{});
 hist=[];hi=-1;snap();drawTree();frLoaded=false;$('#fr').srcdoc=build(cfg);
}

/* ---------- generic form generator ---------- */
const lab=k=>String(k).replace(/([A-Z])/g,' $1').replace(/_/g,' ');
const KEYENUM={frame:['plain','rounded','cinema','polaroid','tv','neon','browser'],source:['auto','file','youtube','vimeo'],titlePos:['below','above']};
const ENUM={'model3d.model':['cafe','pizza','burger','glb'],'theme.mode':['light','dark']};
const pa=p=>esc(JSON.stringify(p));
function summ(v,i){
 if(v&&typeof v==='object'&&!Array.isArray(v)){for(const k of ['name','title','label','id','tag','author','v','text'])if(typeof v[k]==='string'&&v[k])return v[k].slice(0,36)}
 else if(Array.isArray(v))return v.join(' · ').slice(0,36);
 return typeof v==='string'&&v?v.slice(0,36):'item '+(i+1);
}
function field(v,p,showLabel=true){
 const k=p[p.length-1],ps=p.join('.'),a=`data-p="${pa(p)}"`,inV=ps.indexOf('videos')>-1,vid=inV&&(k==='url'||k==='altUrl'),opts=ENUM[ps]||(inV&&KEYENUM[k]);let h;
 if(typeof v==='boolean')h=`<input type="checkbox" ${a} data-t="b" ${v?'checked':''}>`;
 else if(typeof v==='number')h=`<input type="number" step="any" class="i" ${a} data-t="n" value="${v}">`;
 else if(opts)h=`<select class="i" ${a} data-t="s">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(/^#[0-9a-f]{6}$/i.test(v))h=`<div class="row"><input type="color" ${a} data-t="s" value="${v}"><code>${v}</code></div>`;
 else if((/img|image|poster/i.test(k)&&typeof k==='string')||k==='glbUrl'||vid){
  const emb=String(v).startsWith('data:'),glb=k==='glbUrl'||vid;
  h=`<div class="row">${glb?'':`<img class="th" src="${esc(v)}" onerror="this.style.visibility='hidden'">`}<input class="i" ${a} data-t="s" ${emb?'disabled value="(uploaded file embedded)"':`value="${esc(v)}" placeholder="${vid?'YouTube / Vimeo / .mp4 link, or upload':'https://… or upload'}"`}><label class="b sm">Upload<input type="file" hidden data-up="${pa(p)}" accept="${vid?'video/*':glb?'.glb,.gltf':'image/*'}"></label></div>`;
 }
 else if(/^font/.test(k))h=`<input class="i" list="fonts" ${a} data-t="s" value="${esc(v)}">`;
 else if(String(v).length>70||/^(text|desc|quote|p1|p2|html|customCss)$/.test(k))h=`<textarea class="i" ${a} data-t="s" rows="${/^(html|customCss)$/.test(k)?8:3}">${esc(v)}</textarea>`;
 else h=`<input class="i" ${a} data-t="s" value="${esc(v)}" ${k==='id'?'list="ids"':''}>`;
 return showLabel?`<label class="f"><span>${esc(lab(k))}</span>${h}</label>`:`<div style="flex:1;min-width:90px">${h}</div>`;
}
const isPrim=v=>v===null||typeof v!=='object';
function body(v,p){return Object.keys(v).map(k=>child(v[k],[...p,k])).join('')}
function child(v,p){
 if(isPrim(v))return field(v,p);
 const o=p.join('.');
 return`<details data-o="${esc(o)}" ${opened.has(o)?'open':''}><summary>${esc(lab(p[p.length-1]))}</summary><div class="in">${Array.isArray(v)?list(v,p):body(v,p)}</div></details>`;
}
function list(v,p){
 if(v.every(isPrim))return`<div class="row" style="flex-wrap:wrap">${v.map((x,i)=>field(x,[...p,i],false)).join('')}</div>`;
 return v.map((it,i)=>{const q=[...p,i],o=q.join('.'),btn=(a,t,ti)=>`<span class="b sm" data-a="${a}" data-p="${pa(p)}" data-i="${i}" title="${ti}">${t}</span>`;
  return`<details data-o="${esc(o)}" ${opened.has(o)?'open':''}><summary><span class="b sm" draggable="true" data-drag="${esc(o)}" title="Drag to reorder" aria-label="Drag to reorder">⋮⋮</span>${esc(summ(it,i))}<span style="flex:1"></span>${btn('up','↑','Move up')}${btn('down','↓','Move down')}${btn('dup','⧉','Duplicate')}${btn('del','✕','Delete')}</summary><div class="in">${isPrim(it)?field(it,q,false):Array.isArray(it)?list(it,q):body(it,q)}</div></details>`}).join('')
  +`<button class="b sm" data-a="add" data-p="${pa(p)}">+ Add</button>`;
}
function drawTree(){
 const t=$('#tree'),st=$('#side').scrollTop;
 t.innerHTML=Object.keys(cfg).map(k=>child(cfg[k],[k])).join('');
 $('#side').scrollTop=st;
}

/* ---------- editing, history, preview ---------- */
function snap(){const s=JSON.stringify(cfg);if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);while(hist.length>(s.length>8e6?4:30))hist.shift();hi=hist.length-1}
let editOn=true,paths=[];
const SKIPK=/^(id|model|board|glbUrl|href|url|img|image|icon|badgeIcon|extraIcon|mode|fontHead|fontBody|customCss|html|type|endpoint|email|subject|key|altUrl|poster|source|frame|titlePos)$/i;
/* Every visible text value gets an invisible marker so a click in the preview maps back to its exact config path. */
function markCfg(){const ps=[],w=(v,p)=>{
  if(typeof v==='string'){if(!v||SKIPK.test(String(p[p.length-1]))||p[0]==='theme'||p[0]==='seo'||/^(https?:|#|data:)/.test(v))return v;
   const n=ps.push(p)-1;return'\u2063'+n.toString(2).replace(/0/g,'\u200b').replace(/1/g,'\u200c')+'\u2064'+v}
  if(Array.isArray(v))return v.map((x,i)=>w(x,[...p,i]));
  if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=w(v[k],[...p,k]);return o}return v};
 return{cfg:w(cfg,[]),paths:ps}}
function preview(){if(!frLoaded)return;let c=cfg;if(editOn){const m=markCfg();c=m.cfg;paths=m.paths}
 $('#fr').contentWindow.postMessage({studioCfg:c,studioEdit:editOn,studioVals:editOn?paths.map(p=>get(p)):[]},'*')}
function reveal(p){for(let i=1;i<=p.length;i++)opened.add(p.slice(0,i).join('.'));drawTree();
 const el=[...document.querySelectorAll('[data-p]')].find(x=>x.dataset.p===JSON.stringify(p));
 if(el){el.scrollIntoView({block:'center'});el.focus()}}
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object'||e.source!==$('#fr').contentWindow)return;
 if('studioEditIdx' in d){const p=paths[d.studioEditIdx];if(p&&typeof d.value==='string'){set(p,d.value);drawTree();dirty(true)}}
 else if('studioJump' in d){const p=paths[d.studioJump];if(p){reveal(p);msg('This text is edited in the form')}}});
$('#editbtn').onclick=()=>{editOn=!editOn;const b=$('#editbtn');b.setAttribute('aria-pressed',editOn);b.style.borderColor=editOn?'var(--ac)':'';preview();msg(editOn?'Click-to-edit ON: click text in the preview':'Click-to-edit OFF: preview links and buttons work')};
const ask=t=>new Promise(ok=>{$('#dlg-t').textContent=t;const D=$('#dlg');D.style.display='flex';$('#dlg-y').focus();const done=v=>{D.style.display='none';ok(v)};$('#dlg-y').onclick=()=>done(true);$('#dlg-n').onclick=()=>done(false)});
/* drag to reorder list items */
let dragO=null;
$('#tree').addEventListener('dragstart',e=>{const h=e.target.closest&&e.target.closest('[data-drag]');if(!h)return;dragO=h.dataset.drag;if(e.dataTransfer){e.dataTransfer.setData('text/plain',dragO);e.dataTransfer.effectAllowed='move'}});
$('#tree').addEventListener('dragover',e=>{if(dragO&&e.target.closest('details[data-o]'))e.preventDefault()});
$('#tree').addEventListener('drop',e=>{const t=e.target.closest('details[data-o]');if(!dragO||!t)return;e.preventDefault();
 const a=dragO.split('.'),b=t.dataset.o.split('.');dragO=null;
 if(a.length!==b.length||a.slice(0,-1).join('.')!==b.slice(0,-1).join('.'))return;
 const arr=get(a.slice(0,-1)),i=+a[a.length-1],j=+b[b.length-1];if(i===j||!Array.isArray(arr))return;
 arr.splice(j,0,arr.splice(i,1)[0]);drawTree();dirty(true)});
function dirty(now){clearTimeout(tm);tm=setTimeout(()=>{snap();preview();save()},now?0:350)}
$('#fr').onload=()=>{frLoaded=true;preview()};
const tree=$('#tree');
tree.addEventListener('toggle',e=>{const o=e.target.dataset&&e.target.dataset.o;if(o)e.target.open?opened.add(o):opened.delete(o)},true);
tree.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;
 const v=t.dataset.t==='b'?t.checked:t.dataset.t==='n'?(+t.value||0):t.value;
 set(JSON.parse(p),v);if(t.type==='color')t.nextElementSibling.textContent=v;
 const pp=JSON.parse(p);if(pp[0]==='theme'&&/^#[0-9a-f]{6}$/i.test(v)){const T=cfg.theme;try{const lo=ratio(T.accent,T.lightBg),dk=ratio(T.accent,T.darkBg);if(lo<3||dk<3)msg('⚠ Low contrast: accent text is hard to read on the '+(lo<3&&dk<3?'light and dark':lo<3?'light':'dark')+' background ('+Math.min(lo,dk).toFixed(1)+':1, aim for 3+).')}catch(x){}}
 dirty()});
tree.addEventListener('click',e=>{const s=e.target.closest('summary');if(!s||e.target.closest('[data-a]'))return;const d=s.parentElement,o=d.dataset.o;
 if(o&&o.indexOf('.')<0&&!d.open&&frLoaded)$('#fr').contentWindow.postMessage({studioScroll:o},'*')});
tree.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();
 const arr=get(JSON.parse(b.dataset.p)),i=+b.dataset.i,a=b.dataset.a;
 if(a==='add')arr.push(arr.length?clone(arr[arr.length-1]):'');
 else if(a==='dup')arr.splice(i+1,0,clone(arr[i]));
 else if(a==='del'){if(arr.length<2)return msg('Keep at least one item (to hide a whole section, untick its "on" box).');arr.splice(i,1)}
 else if(a==='up'&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
 else if(a==='down'&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
 drawTree();dirty(true)});
tree.addEventListener('change',async e=>{const t=e.target;if(!t.dataset.up||!t.files[0])return;const f=t.files[0];
 msg('Processing file…');
 set(JSON.parse(t.dataset.up),(/^image\//.test(f.type)&&f.type!=='image/svg+xml')?await shrink(f):await readURL(f));
 drawTree();dirty(true);msg(f.size>(/^video\//.test(f.type)?5e6:3e6)?'⚠ '+(f.size/1e6).toFixed(1)+' MB embedded: adds ~33% and makes the page heavy. For videos, host the file (or use YouTube/Vimeo) and paste the link instead.':'File embedded')});

function restore(){cfg=JSON.parse(hist[hi]);drawTree();preview()}
$('#undo').onclick=()=>{snap();if(hi>0){hi--;restore()}};
$('#redo').onclick=()=>{if(hi<hist.length-1){hi++;restore()}};
$('#preset').onchange=async e=>{const k=e.target.value;e.target.value='';if(k&&await ask('Replace ALL current content with the "'+k+'" preset? You can undo this.')){cfg=clone(PRES[k]);drawTree();dirty(true)}};
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>$('#wrap').style.width=b.dataset.w);
$('#export').onclick=()=>{if(!cfg)return msg('Open the template first');download(slug()+'.html',build(cfg),'text/html');msg('Exported '+slug()+'.html')};
$('#save').onclick=()=>{if(!cfg)return msg('Open the template first');download(slug()+'.project.json',JSON.stringify(cfg,null,2),'application/json');msg('Project saved')};
$('#f-proj').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cfg)return msg('Open the template first');
 try{cfg=merge(clone(PRES[Object.keys(PRES)[0]]),JSON.parse(await readText(f)));drawTree();dirty(true);msg('Project loaded')}catch(x){msg('Invalid project file: '+x.message)}};

/* ---------- opening the template ---------- */
async function openFile(f){if(!f)return;try{loadTemplate(await readText(f))}catch(x){alert(x.message)}}
$('#f-tpl').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
$('#f-first').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)openFile(f)});
addEventListener('beforeunload',e=>{if(cfg&&hi>0){e.preventDefault();e.returnValue=''}});
(async function boot(){try{const s=await idb.get('src');if(!s)return;let c=null;try{c=JSON.parse((await idb.get('cfg'))||'null')}catch(x){}loadTemplate(s,c||undefined)}catch(x){}})();
</script>
</body>
</html>
